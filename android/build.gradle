// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        firebaseIidVersion = "19.0.1" 
        buildToolsVersion = "29.0.2"
        minSdkVersion = 21
        compileSdkVersion = 29
        targetSdkVersion = 29
    }
    repositories {
        // Buildscript classpath dependencies (AGP and its transitive libraries)
        // require Maven Central. allprojects.repositories does NOT cover these.
        google()
        mavenCentral()
        // Retain legacy fallback for older project dependencies.
        jcenter()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:3.5.3")
        classpath "com.google.gms:google-services:4.3.5"
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.5.2'
        classpath 'com.google.firebase:perf-plugin:1.3.1'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        mavenLocal()
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url("$rootDir/../node_modules/react-native/android")
        }
        maven {
            // Android JSC is installed from npm
            url("$rootDir/../node_modules/jsc-android/dist")
        }

        google()
        // Maven Central hosts photodraweeview 2.1.0; it must also be visible
        // to transitive native-library subprojects, not only :app.
        mavenCentral()
        jcenter()
        maven { url "https://www.jitpack.io" }
    }
    // The legacy photo viewer requests 1.1.3 from defunct JCenter. 2.1.0
    // is the same upstream artifact from Maven Central; keep this scoped
    // to that coordinate instead of upgrading unrelated dependencies.
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'me.relex' &&
                details.requested.name == 'photodraweeview' &&
                details.requested.version == '1.1.3') {
                details.useVersion '2.1.0'
                details.because '1.1.3 is no longer available from JCenter; 2.1.0 is on Maven Central'
            }
        }
    }
}
